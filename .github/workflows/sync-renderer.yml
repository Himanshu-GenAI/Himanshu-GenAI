name: sync renderer

# One-shot: applies tools/apply_motion_patch.py to render.py, commits the
# result and removes the patcher. Deleted right after it runs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply renderer changes
        run: python3 tools/apply_motion_patch.py

      - name: Commit renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q tools/apply_motion_patch.py
          git add render.py
          git commit -m "feat: reference layout order, tile swing, ring pulse and shine sweeps"
          git push
